name: Publish docs via GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # For git-revision-date plugin

      - uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v3
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      - run: sudo apt-get install pngquant -y

      - run: pip install -r requirements.txt

      # Regenerated before the build so the deployed llms indexes are always
      # current; the drift check below fails the run if the committed copies
      # are stale.
      - name: Generate llms.txt and llms-full.txt
        run: python scripts/gen_llms_txt.py

      - name: llms.txt drift
        run: git diff --exit-code docs/llms.txt docs/llms-full.txt

      - name: Build with Zensical
        run: zensical build

      # Agent surface: per-page Markdown twins, <link rel="alternate">, robots.txt
      - name: Build agent surface
        run: python scripts/postbuild_agent_surface.py site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
